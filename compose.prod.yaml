#
# Production expects its environment to be provided explicitly (for example with
# `docker compose --env-file .env.docker.prod -f compose.yaml -f compose.prod.yaml ...`).
# Do not rely on `.env` defaults intended for local development.
#
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app_prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      DEFAULT_URI: ${DEFAULT_URI:-http://192.168.9.50:8081}
      APP_PREPARE_ON_STARTUP: ${APP_PREPARE_ON_STARTUP:-1}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-0}
    depends_on:
      database:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-8081}:80"

  messenger:
    build:
      context: .
      dockerfile: Dockerfile
      target: app_prod
    restart: unless-stopped
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --env=prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      DEFAULT_URI: ${DEFAULT_URI:-http://192.168.9.50:8081}
      APP_PREPARE_ON_STARTUP: 0
      AUTO_MIGRATE: 0
    depends_on:
      database:
        condition: service_healthy
